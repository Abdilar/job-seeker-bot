services:
  migrate:
    image: job-seeker
    env_file:
      - .env
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-seeker
    container_name: job-bot
    env_file:
      - .env
    command: node dist/bot.bootstrap.js
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  crawler:
    image: job-seeker
    container_name: job-crawler
    env_file:
      - .env
    command: node dist/crawler.bootstrap.js
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17
    container_name: job-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
