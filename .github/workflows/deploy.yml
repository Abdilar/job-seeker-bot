name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v1.0.5)'
        required: true
        type: string

permissions:
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show deployment version
        run: |
          echo "Deploying version: ${{ inputs.version }}"

      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${{ inputs.version }}"
            echo "Expected format: v1.0.5"
            exit 1
          fi

          echo "Version is valid: ${{ inputs.version }}"

      - name: Login to github container repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.version }}"
          echo "Checking image: $IMAGE"

          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Docker image does not exist: $IMAGE"
            exit 1
          fi

          echo "Docker image exists: $IMAGE"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production environment file
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          printf '%s\n' "$PRODUCTION_ENV" > .env.production 
          printf "APP_VERSION=%s\n" "$APP_VERSION" >> .env.production
          chmod 600 .env.production

      - name: Transfer docker compose and production environment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
          -i ~/.ssh/deploy_key \
          -P "$VPS_PORT" \
          compose.production.yml \
          .env.production \
          "$VPS_USER@$VPS_HOST:/var/www/job-seeker-bot/"

      - name: Secure production environment file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
          -i ~/.ssh/deploy_key \
          -p "$VPS_PORT" \
          "$VPS_USER@$VPS_HOST" \
          'chmod 600 /var/www/job-seeker-bot/.env.production'

      - name: Validate production docker compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
          -i ~/.ssh/deploy_key \
          -p "$VPS_PORT" \
          "$VPS_USER@$VPS_HOST" \
          'cd /var/www/job-seeker-bot && docker compose --env-file .env.production -f compose.production.yml config --quiet'

      - name: Pull docker image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'cd /var/www/job-seeker-bot && docker compose --env-file .env.production -f compose.production.yml pull bot crawler migrate'

      - name: Run prisma migration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'cd /var/www/job-seeker-bot && docker compose --env-file .env.production -f compose.production.yml run --rm migrate'

      - name: Deploy bot and crawler
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'cd /var/www/job-seeker-bot && docker compose --env-file .env.production -f compose.production.yml up -d --no-deps --force-recreate bot crawler'

      - name: Verify application health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'EOF'
          set -e

          for container in job-bot job-crawler; do
            echo "Checking health of $container..."

            for attempt in $(seq 1 30); do
              STATUS=$(docker inspect \
                --format '{{.State.Health.Status}}' \
                "$container")

              echo "$container health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "$container is healthy!"
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                docker logs --tail 50 "$container"
                exit 1
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "$container health check timed out"
                docker logs --tail 50 "$container"
                exit 1
              fi

              sleep 2
            done
          done

          echo "All application containers are healthy!"
          EOF

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'cd /var/www/job-seeker-bot && docker compose --env-file .env.production -f compose.production.yml ps'

      - name: Cleanup old docker images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CURRENT_VERSION: ${{ inputs.version }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "CURRENT_VERSION='$CURRENT_VERSION' bash -s" <<'EOF'
          set -euo pipefail

          IMAGE_REPOSITORY="ghcr.io/abdilar/job-seeker-bot"

          echo "Current version: $CURRENT_VERSION"

          # Find the image used by the running bot
          RUNNING_IMAGE=$(docker inspect \
            --format '{{.Config.Image}}' \
            job-bot)

          if [ "$RUNNING_IMAGE" != "$IMAGE_REPOSITORY:$CURRENT_VERSION" ]; then
            echo "Running image does not match deployed version"
            exit 1
          fi

          # List all project images except the current version
          mapfile -t OLD_IMAGES < <(
            docker image ls \
              --format '{{.Repository}}:{{.Tag}}' \
              "$IMAGE_REPOSITORY" |
            grep -v -F -x "$IMAGE_REPOSITORY:$CURRENT_VERSION" |
            sort -V
          )

          # Keep the newest previous image for rollback
          KEEP_IMAGE=""

          if [ "${#OLD_IMAGES[@]}" -gt 0 ]; then
            KEEP_IMAGE="${OLD_IMAGES[-1]}"
          fi

          echo "Keeping current image: $RUNNING_IMAGE"
          echo "Keeping rollback image: $KEEP_IMAGE"

          for IMAGE in "${OLD_IMAGES[@]}"; do
            if [ "$IMAGE" = "$KEEP_IMAGE" ]; then
              continue
            fi

            echo "Removing old image: $IMAGE"
            docker image rm "$IMAGE" || true
          done

          echo "Docker image cleanup completed"
          EOF
