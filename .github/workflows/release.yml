name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Verify release commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Release
        id: release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version update pull request
        if: ${{ steps.release.outputs.version != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          BRANCH="chore/release-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(release): ${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body "Update package.json and package-lock.json to version ${VERSION}."

          gh pr merge "$BRANCH" \
            --squash \
            --delete-branch \
            --auto

      - name: Login to ghcr
        if: ${{ steps.release.outputs.version != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout released version
        if: ${{ steps.release.outputs.version != '' }}
        run: |
          git checkout "${{ steps.release.outputs.version }}"

      - name: Prepare docker image name
        if: ${{ steps.release.outputs.version != '' }}
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build docker image
        if: ${{ steps.release.outputs.version != '' }}
        run: |
          docker build \
          -t ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }} \
          .

      - name: Push docker image
        if: ${{ steps.release.outputs.version != '' }}
        run: |
          docker push \
          ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}
